<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ProSpot Quote{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for ('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
    {% block head %}{% endblock %}
</head>

<body>

<div class="container">
    <div class="row justify-content-center my-4">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <div class="card header-card rounded-lg text-center">
                <div class="row align-items-center">
                    <div class="col-lg-6 col-md-12 col-sm-12">
                        <img src="{{ url_for('static', filename='images/propspotlogo.png') }}" class="logo-img">
                    </div>
                    <div class="col-lg-6 col-md-12 col-sm-12 custom-text">
                        FINANCING
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row justify-content-center my-3">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <div class="steps">
                {% for i in range(1, 4) %}
                    <span class="circle {% if step >= i %}active{% endif %} {% if step == i %}current{% endif %}">
                        {% if step > i %}
                            <i class="bi bi-check-circle-fill"></i>
                        {% else %}
                            {{ i }}
                        {% endif %}
                    </span>
                {% endfor %}
                <div class="progress-bar">
                    <span class="indicator" id="progress-indicator" data-target-width="{{ ((step - 1) / 2) * 100 }}"></span>
                </div>
            </div>
        </div>
    </div>
</div>
{% block content %}
{% endblock %}

<script>

</script>

{% block scripts %}{% endblock %}

</body>
</html>
