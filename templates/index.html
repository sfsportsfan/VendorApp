{% extends "base.html" %}

{% block content %}

<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">
            {% if equip_cost == None %}
                <div class="message d-flex align-items-center" style="height: 30px;">
                    {% if error %}
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16" style="margin: 0px 5px;">
                        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                    </svg>  {{ message }}
                    {% endif %}
                </div>
                <form class="w-100" method="POST">
                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="bi bi-currency-dollar"></i>
                        </span>
                        <input type="number" class="form-control" name="cost" placeholder="Enter Equipment Cost from your Quote">
                    </div>
                    <button class="btn btn-custom w-100" type="submit">Get Financing Estimate</button>
                </form>
            {% endif %}
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
</script>

{% endblock %}
