{% extends "base.html" %}

{% block content %}
<div class="container text-center">
    <div class="row justify-content-center mt-4 mb-3">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <form method="GET" action="{{ url_for('payment') }}">
                <input type="hidden" name="amount" value="{{ amount }}">
                <label class="toggle">
                    <input type="checkbox" name="deferral" value="true"
                           {{ 'checked' if deferral else '' }}
                            onchange="this.form.submit()">
                    <span class="track">
                        <span class="highlight"></span>
                        <span class="option option-standard">Standard Program</span>
                        <span class="option option-deferral">90 Day Deferral</span>
                    </span>
                </label>
            </form>
        </div>
    </div>
    <div class="row justify-content-center mt-4 mb-3">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <div class="card px-3 py-1 text-start">
                <p style="margin-bottom: 2px;">Equipment Cost</p>
                <h4 style="margin-top: 0px;">{{ cost }}</h4>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mb-3">
        <div class="col-lg-3 col-md-8 col-sm-10">
            <div class="card px-3 py-1 mb-3 text-start">
                <p style="margin-bottom: 2px;">Months</p>
                <h4 style="margin-top: 0px;">60</h4>
            </div>
        </div>

        <div class="col-lg-3 col-md-8 col-sm-10">
            <div class="card px-3 py-1 text-start mb-3">
                <p style="margin-bottom: 2px;">Estimated Payment</p>
                <h4 style="margin-top: 0px;">{{ payment }}</h4>
            </div>
        </div>
    </div>
    <div class="row justify-content-center mt-3">
            <h5>Please complete the following</h5>
            <form method="POST" action="{{ url_for ('contact') }}">
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-8 col-sm-10">
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="bi bi-buildings"></i>
                            </span>
                        <input type="text" class="form-control" name="company" placeholder="Company Name" required>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-lg-3 col-md-8 col-sm-10">
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control" name="first" placeholder="First Name" required>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-8 col-sm-10">
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control" name="last" placeholder="Last Name" required>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-lg-3 col-md-8 col-sm-10">
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="bi bi-phone"></i>
                            </span>
                            <input type="text" class="form-control" name="phone" placeholder="Phone Number" required>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-8 col-sm-10">
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="bi bi-envelope-at"></i>
                            </span>
                            <input type="text" class="form-control" name="email" placeholder="Email" required>
                        </div>
                    </div>
                </div>
                 <div class="row justify-content-center mb-3">
                    <div class="col-lg-3 col-md-4 col-sm-5 mb-3">
                        <a href="{{ url_for('index') }}" class="btn btn-custom w-100">Go Back</a>
                    </div>
                    <div class="col-lg-3 col-md-4 col-sm-5 mb-3">
                         <button type="submit" class="btn btn-custom w-100">Next</button>
                    </div>
                </div>
            </form>
    </div>
</div>

{% endblock %}
