{% include "header.html" %}
{% if amount is not none and payment is not none %}
<style>
  .bg-image {
     background-image: url("{{ url_for ('static', filename='/images/welder.jpg') }}");
     height: 100vh;
     background-size: cover;
    }

  .form-control {
    background-color: transparent;
    color: white !important;
    border-radius: 0;
    focus: none;
    box-shadow: none;
    }

  .form-control::placeholder {
     color: white !important;
     opacity: 0.7 !important;
    }

  .card {
    border-radius: 0;
    border: none;
    }

</style>

<div class="bg-image">
    <br>
    <br>
     <div class="row">
      <div class="card col-4 offset-1" style="background-color: rgb(0,0,0, 0.6); color: white; text-align: center;">
        <div class="card-body">
              <h1><b>{{ payment }}</b></h1>
                <p style="opacity: 0.7;">Per Month</p>
                <br>
              <h5>60 Months</h5>
              <p style="opacity: 0.7;">Term</p>
                <br>
              <h5>{{ equipment }}</h5>
              <p style="opacity: 0.7;">Equipment</p>
                <br>
              <h5>{{ amount }}</h5>
              <p style="opacity: 0.7;">Financed Amount</p>
        </div>
      </div>
           <div class="card col-6" style="background-color: rgb(0,0,0, 0.6); color: white;">
             <div class="card-body">
                 <br>
                 <h2 style="color: white; text-align: center; font-weight: bold;">Company Info</h2>
                 <br>
                 <form method="POST" action="{{ url_for('contact') }}" style="box-shadow: none;">
                     <input type="hidden" name="equipment" value="{{ equipment }}">
                     <div class="input-group mb-3">
                        <input type="text" class="form-control bg-transparent" id="validationDefault01" name="Company" placeholder="Company Name" style="focus:none; box-shadow: none;" required>
                     </div>
                     <div class="row g-3">
                        <div class="col">
                             <div class="input-group mb-3">
                                <input type="text" class="form-control bg-transparent" name="FirstName" id="First Name" placeholder="First Name" style="focus:none; box-shadow: none;" required>
                             </div>
                        </div>
                        <div class="col">
                             <div class="input-group mb-3">
                                <input type="text" class="form-control bg-transparent" name="LastName" id="Last Name" placeholder="Last Name" style="focus:none; box-shadow: none;" required>
                             </div>
                        </div>
                     </div>
                     <div class="input-group mb-3">
                        <input type="text" class="form-control bg-transparent" name="Phone" id="Phone" placeholder="Phone" style="focus:none; box-shadow: none;" required>
                     </div>
                     <div class="input-group mb-3">
                        <input type="text" class="form-control bg-transparent" name="Email" id="Email" placeholder="Email" style="focus:none; box-shadow: none;" required>
                     </div>
                     <div>
                         <button type="submit" class="btn btn-outline-light">Submit</button>
                     </div>
                 </form>
             </div>

         </div>
        </div>
  </div>
{% endif %}
